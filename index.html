<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kido HTML/CSS Translator V2</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">

  <style>
    :root {
      --bg: #1a1a2e;
      --panel: #16213e;
      --panel2: #0d1b2a;
      --border: #0f3460;
      --accent: #e94560;
      --accent-hover: #c73652;
      --text: #a8b2d8;
      --text-bright: #ccd6f6;
      --text-dim: #5a6a8a;
      --mono: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      --radius: 8px;
      --success: #64ffda;
      --warning: #ffd080;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-bright);
      letter-spacing: 0.03em;
      margin-right: auto;
    }
    h1 span { color: var(--accent); }

    .lang-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    label {
      font-size: 0.78rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 7px 10px;
      border-radius: var(--radius);
      font-size: 0.88rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus { border-color: var(--accent); }

    .arrow { color: var(--text-dim); font-size: 1rem; }

    #btn-translate {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 22px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #btn-translate:hover:not(:disabled) { background: var(--accent-hover); }
    #btn-translate:disabled { opacity: 0.55; cursor: not-allowed; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      min-width: 0;
      overflow: hidden;
    }
    .panel:last-child { border-right: none; }

    .panel-header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .panel-actions { display: flex; gap: 6px; align-items: center; }

    .btn-sm {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--text-bright); }
    .btn-sm.active { border-color: var(--accent); color: var(--accent); }
    .btn-sm.btn-format { color: var(--text-dim); }
    .btn-sm.btn-format:hover { border-color: var(--success); color: var(--success); }

    .panel-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* CodeMirror */
    #cm-wrapper {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .CodeMirror {
      height: 100% !important;
      font-family: var(--mono) !important;
      font-size: 0.84rem !important;
      line-height: 1.6 !important;
    }

    .CodeMirror-gutters {
      background: #080f1e !important;
      border-right: 1px solid #1a2e4a !important;
    }

    .CodeMirror-linenumber {
      color: #354a6a !important;
      padding: 0 10px 0 6px !important;
    }

    .CodeMirror-cursor { border-left: 2px solid var(--accent) !important; }
    .CodeMirror-selected { background: rgba(233,69,96,0.14) !important; }
    .CodeMirror-activeline-background { background: rgba(15,52,96,0.35) !important; }
    .CodeMirror-matchingtag { background: rgba(233,69,96,0.18); border-radius: 2px; }

    .CodeMirror-lint-mark-error { border-bottom: 2px wavy var(--accent); }
    .CodeMirror-lint-mark-warning { border-bottom: 2px wavy var(--warning); }
    .CodeMirror-lint-marker-error { color: var(--accent) !important; font-size: 0.8rem; }
    .CodeMirror-lint-marker-warning { color: var(--warning) !important; font-size: 0.8rem; }

    .CodeMirror-lint-tooltip {
      background: #0a1524 !important;
      border: 1px solid var(--accent) !important;
      color: var(--text-bright) !important;
      font-family: var(--mono) !important;
      font-size: 0.76rem !important;
      border-radius: 4px !important;
      padding: 6px 10px !important;
      max-width: 320px;
      line-height: 1.5;
    }

    /* Error / warning line highlights */
    .cm-line-error   { background: rgba(233, 69, 96, 0.12) !important; }
    .cm-line-warning { background: rgba(255, 208, 128, 0.09) !important; }

    /* Problems panel */
    #problems-panel {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 160px;
      transition: max-height 0.18s ease;
      border-top: 1px solid var(--border);
    }
    #problems-panel.collapsed { max-height: 25px; }

    #problems-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 10px 3px 12px;
      min-height: 25px;
      cursor: pointer;
      user-select: none;
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      background: var(--panel);
      flex-shrink: 0;
    }
    #problems-header:hover { color: var(--text); }
    #problems-chevron { font-size: 0.6rem; }

    #problems-list { overflow-y: auto; flex: 1; }

    .problem-item {
      display: flex;
      align-items: baseline;
      gap: 7px;
      padding: 2px 12px 2px 10px;
      font-size: 0.75rem;
      font-family: var(--mono);
      cursor: pointer;
      border-left: 2px solid transparent;
      line-height: 1.65;
    }
    .problem-item:hover { background: rgba(255,255,255,0.04); }
    .problem-item.p-error  { border-left-color: var(--accent); }
    .problem-item.p-warning { border-left-color: var(--warning); }

    .p-icon { font-size: 0.62rem; flex-shrink: 0; }
    .p-icon.p-error   { color: var(--accent); }
    .p-icon.p-warning { color: var(--warning); }

    .p-loc { color: var(--text-dim); min-width: 46px; flex-shrink: 0; }
    .p-msg { color: var(--text); }

    /* Output */
    #code-view { flex: 1; min-height: 0; overflow: auto; background: var(--panel2); }

    pre {
      font-family: var(--mono);
      font-size: 0.84rem;
      line-height: 1.6;
      color: var(--text-bright);
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 100%;
    }

    #preview-frame,
    #input-preview-frame { flex: 1; min-height: 0; width: 100%; border: none; background: #fff; }

    /* Error panel */
    #error-panel {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: var(--panel2);
      padding: 28px 28px 20px;
      display: none;
    }
    #error-panel.visible { display: block; }

    .error-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(233,69,96,0.2);
    }

    .error-icon {
      width: 36px; height: 36px;
      background: rgba(233,69,96,0.1);
      border: 1px solid rgba(233,69,96,0.45);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    .error-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .error-subtitle {
      font-size: 0.73rem;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .error-msg-box {
      background: rgba(233,69,96,0.06);
      border: 1px solid rgba(233,69,96,0.18);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 13px 16px;
      margin-bottom: 20px;
      color: #ff8099;
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.7;
      word-break: break-word;
    }

    .fix-heading {
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .fix-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 9px;
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.55;
    }

    .fix-arrow { color: var(--warning); flex-shrink: 0; }

    .panel-footer {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 5px 16px;
      font-size: 0.72rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-ok { color: var(--success); }
    .status-error { color: var(--accent); }
    .status-warning { color: var(--warning); }

    @media (max-width: 720px) {
      main { flex-direction: column; }
      .panel { border-right: none; border-bottom: 1px solid var(--border); }
      .panel:last-child { border-bottom: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>Kido <span>HTML/CSS</span> Translator <span style="font-size:0.7em;opacity:0.6">V2</span></h1>
  <div class="lang-controls">
    <label for="src-lang">From</label>
    <select id="src-lang"></select>
    <span class="arrow">→</span>
    <label for="tgt-lang">To</label>
    <select id="tgt-lang"></select>
    <button id="btn-translate">
      <div class="spinner" id="spinner"></div>
      Translate
    </button>
  </div>
</header>

<main>
  <!-- Input panel -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Input</span>
      <div class="panel-actions">
        <button class="btn-sm btn-format" id="btn-format" title="Format &amp; indent code (Ctrl+Shift+F)">⌥ Format</button>
        <button class="btn-sm active" id="btn-input-code">Code</button>
        <button class="btn-sm" id="btn-input-preview">Preview</button>
        <button class="btn-sm" id="btn-clear">Clear</button>
      </div>
    </div>
    <div class="panel-body">
      <div id="cm-wrapper">
        <textarea id="input-area" spellcheck="false"></textarea>
      </div>
      <!-- Problems panel (VS Code-style) -->
      <div id="problems-panel" class="collapsed">
        <div id="problems-header">
          <span id="problems-title">Problems</span>
          <span id="problems-chevron">▼</span>
        </div>
        <div id="problems-list"></div>
      </div>
      <iframe id="input-preview-frame" style="display:none"
              sandbox="allow-scripts allow-same-origin" title="Input Preview"></iframe>
    </div>
    <div class="panel-footer">
      <span id="lint-status">HTML / CSS</span>
      <span id="input-count">0 chars</span>
    </div>
  </div>

  <!-- Output panel -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Output</span>
      <div class="panel-actions">
        <button class="btn-sm active" id="btn-code">Code</button>
        <button class="btn-sm" id="btn-preview">Preview</button>
        <button class="btn-sm" id="btn-copy">Copy</button>
      </div>
    </div>
    <div class="panel-body">
      <div id="code-view">
        <pre id="output-pre"><span style="color:var(--text-dim)">Translated HTML will appear here…</span></pre>
      </div>
      <iframe id="preview-frame" style="display:none"
              sandbox="allow-scripts allow-same-origin" title="Preview"></iframe>
      <div id="error-panel">
        <div class="error-header">
          <div class="error-icon">✕</div>
          <div>
            <div class="error-title" id="error-title">Processing Error</div>
            <div class="error-subtitle" id="error-subtitle">The code could not be processed</div>
          </div>
        </div>
        <div class="error-msg-box" id="error-msg-box"></div>
        <div id="error-fixes"></div>
      </div>
    </div>
    <div class="panel-footer">
      <span id="output-label">Translated</span>
      <span id="output-count">0 chars</span>
    </div>
  </div>
</main>

<!-- CodeMirror 5 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchtags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/autorefresh.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
<!-- HTMLHint for live linting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmlhint/1.1.4/htmlhint.min.js"></script>
<!-- js-beautify for code formatting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js"></script>

<script>
  const LANGUAGES = [
    "English","Spanish","French","German","Italian",
    "Portuguese","Dutch","Polish","Russian","Chinese","Japanese","Arabic","Catalan"
  ];

  const srcSel            = document.getElementById("src-lang");
  const tgtSel            = document.getElementById("tgt-lang");
  const outputPre         = document.getElementById("output-pre");
  const codeView          = document.getElementById("code-view");
  const previewFrame      = document.getElementById("preview-frame");
  const inputPreviewFrame = document.getElementById("input-preview-frame");
  const cmWrapper         = document.getElementById("cm-wrapper");
  const btnTranslate      = document.getElementById("btn-translate");
  const btnCode           = document.getElementById("btn-code");
  const btnPreview        = document.getElementById("btn-preview");
  const btnCopy           = document.getElementById("btn-copy");
  const btnClear          = document.getElementById("btn-clear");
  const btnFormat         = document.getElementById("btn-format");
  const btnInputCode      = document.getElementById("btn-input-code");
  const btnInputPreview   = document.getElementById("btn-input-preview");
  const inputCount        = document.getElementById("input-count");
  const outputCount       = document.getElementById("output-count");
  const spinner           = document.getElementById("spinner");
  const lintStatus        = document.getElementById("lint-status");
  const errorPanel        = document.getElementById("error-panel");
  const errorMsgBox       = document.getElementById("error-msg-box");
  const errorFixes        = document.getElementById("error-fixes");
  const errorTitle        = document.getElementById("error-title");
  const errorSubtitle     = document.getElementById("error-subtitle");
  const problemsPanel     = document.getElementById("problems-panel");
  const problemsHeader    = document.getElementById("problems-header");
  const problemsList      = document.getElementById("problems-list");
  const problemsTitle     = document.getElementById("problems-title");
  const problemsChevron   = document.getElementById("problems-chevron");

  let translatedHtml = "";
  let outputViewMode = "code";
  let inputViewMode  = "code";

  // Populate dropdowns
  LANGUAGES.forEach(lang => {
    const o1 = new Option(lang, lang);
    const o2 = new Option(lang, lang);
    if (lang === "English") o1.selected = true;
    if (lang === "Spanish") o2.selected = true;
    srcSel.appendChild(o1);
    tgtSel.appendChild(o2);
  });

  // ── Custom HTML nesting validator ─────────────────────────────────────────
  const VOID_TAGS = new Set([
    "area","base","br","col","embed","hr","img","input",
    "link","meta","param","source","track","wbr"
  ]);
  // Content of these tags is not parsed as HTML
  const RAW_TEXT_TAGS = new Set(["script","style","textarea","title"]);

  function getLineCol(text, index) {
    const before = text.substring(0, index);
    const lines  = before.split("\n");
    return { line: lines.length, col: lines[lines.length - 1].length + 1 };
  }

  function validateNesting(text) {
    const errors = [];
    const stack  = []; // { name, line, col }
    let inRaw    = null;

    // Matches: comments, doctype, closing tags, opening tags (with optional self-close slash)
    const re = /<!--[\s\S]*?-->|<!DOCTYPE[^>]*>|<\/\s*([a-zA-Z][a-zA-Z0-9:-]*)\s*>|<([a-zA-Z][a-zA-Z0-9:-]*)(\s[^>]*)?\s*(\/?)>/g;
    let m;

    while ((m = re.exec(text)) !== null) {
      const closeTag  = m[1];
      const openTag   = m[2];
      const selfClose = m[4];

      if (!closeTag && !openTag) continue; // comment / doctype

      const pos = getLineCol(text, m.index);

      if (closeTag) {
        const name = closeTag.toLowerCase();
        if (inRaw) {
          if (name === inRaw) {
            inRaw = null;
            // Pop the raw-text tag that was pushed when we opened it
            if (stack.length > 0 && stack[stack.length - 1].name === name) stack.pop();
          }
          continue;
        }
        if (stack.length === 0) {
          errors.push({ line: pos.line, col: pos.col, message: `Unexpected closing tag </${name}>`, type: "error" });
        } else {
          const top = stack[stack.length - 1];
          if (top.name !== name) {
            // Look for matching opener further down the stack
            let idx = -1;
            for (let i = stack.length - 1; i >= 0; i--) {
              if (stack[i].name === name) { idx = i; break; }
            }
            if (idx >= 0) {
              // Report everything between the match and the top as improperly closed
              while (stack.length > idx + 1) {
                const u = stack.pop();
                errors.push({ line: u.line, col: u.col, message: `<${u.name}> not closed before </${name}>`, type: "error" });
              }
              stack.pop();
            } else {
              errors.push({ line: pos.line, col: pos.col, message: `Unexpected closing tag </${name}>`, type: "error" });
            }
          } else {
            stack.pop();
          }
        }
      } else if (openTag) {
        const name = openTag.toLowerCase();
        if (inRaw) continue;
        if (VOID_TAGS.has(name) || selfClose === "/") continue;
        stack.push({ name, line: pos.line, col: pos.col });
        if (RAW_TEXT_TAGS.has(name)) inRaw = name;
      }
    }

    // Anything still open was never closed
    for (let i = stack.length - 1; i >= 0; i--) {
      const t = stack[i];
      errors.push({ line: t.line, col: t.col, message: `Tag <${t.name}> is never closed`, type: "error" });
    }

    return errors;
  }

  // ── Problems panel ─────────────────────────────────────────────────────────
  function updateProblemsPanel(annotations) {
    if (!annotations.length) {
      problemsPanel.classList.add("collapsed");
      problemsChevron.textContent = "▼";
      problemsTitle.textContent = "Problems";
      problemsList.innerHTML = "";
      return;
    }

    const sorted = [...annotations].sort(
      (a, b) => a.from.line - b.from.line || a.from.ch - b.from.ch
    );

    problemsTitle.textContent = `Problems (${annotations.length})`;
    problemsPanel.classList.remove("collapsed");
    problemsChevron.textContent = "▲";

    problemsList.innerHTML = sorted.map(a => {
      const cls  = a.severity === "error" ? "p-error" : "p-warning";
      const icon = a.severity === "error" ? "✕" : "⚠";
      return (
        `<div class="problem-item ${cls}" data-line="${a.from.line}" data-ch="${a.from.ch}">` +
        `<span class="p-icon ${cls}">${icon}</span>` +
        `<span class="p-loc">${a.from.line + 1}:${a.from.ch + 1}</span>` +
        `<span class="p-msg">${escHtml(a.message)}</span>` +
        `</div>`
      );
    }).join("");

    problemsList.querySelectorAll(".problem-item").forEach(item => {
      item.addEventListener("click", () => {
        const line = parseInt(item.dataset.line, 10);
        const ch   = parseInt(item.dataset.ch, 10);
        if (inputViewMode !== "code") setInputView("code");
        editor.focus();
        editor.setCursor(line, ch);
        editor.scrollIntoView({ line, ch }, 80);
      });
    });
  }

  problemsHeader.addEventListener("click", () => {
    problemsPanel.classList.toggle("collapsed");
    problemsChevron.textContent = problemsPanel.classList.contains("collapsed") ? "▼" : "▲";
  });

  // ── HTMLHint annotations — for CodeMirror wavy underlines + gutter dots ──
  function htmlAnnotations(text, options, cm) {
    if (!text.trim() || !window.HTMLHint) return [];
    const result = [];
    try {
      window.HTMLHint.verify(text, {
        "tag-pair":             true,
        "attr-lowercase":       true,
        "id-unique":            true,
        "src-not-empty":        true,
        "tag-self-close":       false,
        "attr-value-not-empty": false,
        "spec-char-escape":     false,
      }).forEach(h => result.push({
        from:     CodeMirror.Pos(h.line - 1, h.col - 1),
        to:       CodeMirror.Pos(h.line - 1, h.col),
        message:  h.message,
        severity: h.type,
      }));
    } catch (_) {}
    try {
      validateNesting(text).forEach(e => result.push({
        from:     CodeMirror.Pos(e.line - 1, Math.max(0, e.col - 1)),
        to:       CodeMirror.Pos(e.line - 1, e.col + 15),
        message:  e.message,
        severity: "error",
      }));
    } catch (_) {}
    return result;
  }

  // ── Problems panel + footer — driven directly from editor change, independent of lint addon ──
  let _valTimer    = null;
  let _markedLines = [];
  function scheduleValidation(text) {
    clearTimeout(_valTimer);
    _valTimer = setTimeout(() => runValidation(text), 400);
  }

  function runValidation(text) {
    if (!text.trim()) {
      lintStatus.textContent = "HTML / CSS";
      lintStatus.className   = "";
      updateProblemsPanel([]);
      return;
    }

    const raw = [];

    if (window.HTMLHint) {
      try {
        window.HTMLHint.verify(text, {
          "tag-pair":             true,
          "attr-lowercase":       true,
          "id-unique":            true,
          "src-not-empty":        true,
          "tag-self-close":       false,
          "attr-value-not-empty": false,
          "spec-char-escape":     false,
        }).forEach(h => raw.push({ line: h.line, col: h.col, message: h.message, type: h.type }));
      } catch (_) {}
    }

    try {
      validateNesting(text).forEach(e => raw.push(e));
    } catch (_) {}

    let errN = 0, warnN = 0;
    raw.forEach(e => e.type === "error" ? errN++ : warnN++);

    if (errN > 0) {
      lintStatus.textContent = `✕ ${errN} error${errN > 1 ? "s" : ""}` +
        (warnN ? ` · ${warnN} warning${warnN > 1 ? "s" : ""}` : "");
      lintStatus.className = "status-error";
    } else if (warnN > 0) {
      lintStatus.textContent = `⚠ ${warnN} warning${warnN > 1 ? "s" : ""}`;
      lintStatus.className = "status-warning";
    } else {
      lintStatus.textContent = "✓ No issues";
      lintStatus.className = "status-ok";
    }

    updateProblemsPanel(raw.map(e => ({
      from:     CodeMirror.Pos(e.line - 1, Math.max(0, e.col - 1)),
      to:       CodeMirror.Pos(e.line - 1, e.col + 5),
      message:  e.message,
      severity: e.type,
    })));

    // Highlight error/warning lines in the editor
    _markedLines.forEach(l => {
      editor.removeLineClass(l, "background", "cm-line-error");
      editor.removeLineClass(l, "background", "cm-line-warning");
    });
    _markedLines = [];
    const seen = new Set();
    raw.forEach(e => {
      const line = e.line - 1;
      if (line < 0 || line >= editor.lineCount() || seen.has(line)) return;
      seen.add(line);
      editor.addLineClass(line, "background", e.type === "error" ? "cm-line-error" : "cm-line-warning");
      _markedLines.push(line);
    });
  }

  // ── Init CodeMirror ─────────────────────────────────────────────────────────
  const editor = CodeMirror.fromTextArea(document.getElementById("input-area"), {
    mode:             "htmlmixed",
    theme:            "dracula",
    lineNumbers:      true,
    matchBrackets:    true,
    autoCloseBrackets:true,
    autoCloseTags:    true,
    matchTags:        { bothTags: true },
    styleActiveLine:  true,
    autoRefresh:      true,
    tabSize:          2,
    indentWithTabs:   false,
    lineWrapping:     true,
    gutters:          ["CodeMirror-linenumbers", "CodeMirror-lint-markers"],
    lint:             { delay: 400, getAnnotations: htmlAnnotations },
    extraKeys: {
      "Ctrl-Enter":   () => translate(),
      "Cmd-Enter":    () => translate(),
      "Ctrl-Shift-F": () => formatCode(),
    },
  });

  // Make CodeMirror fill its wrapper by matching heights via ResizeObserver
  function syncEditorHeight() {
    const h = cmWrapper.getBoundingClientRect().height;
    if (h > 0) editor.setSize(null, h);
  }
  const ro = new ResizeObserver(syncEditorHeight);
  ro.observe(cmWrapper);
  syncEditorHeight();

  editor.on("change", () => {
    const val = editor.getValue();
    inputCount.textContent = val.length.toLocaleString() + " chars";
    if (inputViewMode === "preview") inputPreviewFrame.srcdoc = val;
    scheduleValidation(val);
  });

  // ── Format code ─────────────────────────────────────────────────────────────
  function formatCode() {
    const raw = editor.getValue();
    if (!raw.trim() || !window.html_beautify) return;
    let formatted = raw;
    try {
      formatted = html_beautify(raw, {
        indent_size:           2,
        indent_char:           " ",
        max_preserve_newlines: 1,
        preserve_newlines:     true,
        end_with_newline:      false,
        wrap_line_length:      0,
        extra_liners:          ["head", "body", "/html"],
      });
    } catch (_) {}
    const cursor = editor.getCursor();
    editor.setValue(formatted);
    try { editor.setCursor(cursor); } catch (_) {}
    editor.refresh();
  }

  btnFormat.addEventListener("click", formatCode);

  // ── Input view toggle ───────────────────────────────────────────────────────
  function setInputView(mode) {
    inputViewMode = mode;
    if (mode === "code") {
      cmWrapper.style.display         = "";
      problemsPanel.style.display     = "";
      inputPreviewFrame.style.display = "none";
      btnInputCode.classList.add("active");
      btnInputPreview.classList.remove("active");
      requestAnimationFrame(() => { syncEditorHeight(); editor.refresh(); });
    } else {
      cmWrapper.style.display         = "none";
      problemsPanel.style.display     = "none";
      inputPreviewFrame.style.display = "block";
      btnInputCode.classList.remove("active");
      btnInputPreview.classList.add("active");
      inputPreviewFrame.srcdoc = editor.getValue();
    }
  }

  btnInputCode.addEventListener("click",    () => setInputView("code"));
  btnInputPreview.addEventListener("click", () => setInputView("preview"));

  // ── Output view toggle ──────────────────────────────────────────────────────
  function setOutputView(mode) {
    outputViewMode = mode;
    codeView.style.display     = "none";
    previewFrame.style.display = "none";
    errorPanel.classList.remove("visible");

    if (mode === "code") {
      codeView.style.display = "";
      btnCode.classList.add("active");
      btnPreview.classList.remove("active");
    } else {
      previewFrame.style.display = "block";
      btnCode.classList.remove("active");
      btnPreview.classList.add("active");
      previewFrame.srcdoc = translatedHtml;
    }
  }

  btnCode.addEventListener("click",    () => setOutputView("code"));
  btnPreview.addEventListener("click", () => { if (translatedHtml) setOutputView("preview"); });

  // ── Clear ───────────────────────────────────────────────────────────────────
  btnClear.addEventListener("click", () => {
    editor.setValue("");
    inputCount.textContent = "0 chars";
    lintStatus.textContent = "HTML / CSS";
    lintStatus.className   = "";
    translatedHtml         = "";
    outputPre.innerHTML    = `<span style="color:var(--text-dim)">Translated HTML will appear here…</span>`;
    outputCount.textContent = "0 chars";
    previewFrame.srcdoc     = "";
    inputPreviewFrame.srcdoc = "";
    errorPanel.classList.remove("visible");
    updateProblemsPanel([]);
    _markedLines.forEach(l => {
      editor.removeLineClass(l, "background", "cm-line-error");
      editor.removeLineClass(l, "background", "cm-line-warning");
    });
    _markedLines = [];
    setOutputView("code");
    setInputView("code");
  });

  // ── Copy ────────────────────────────────────────────────────────────────────
  btnCopy.addEventListener("click", async () => {
    if (!translatedHtml) return;
    try { await navigator.clipboard.writeText(translatedHtml); }
    catch {
      const ta = Object.assign(document.createElement("textarea"), { value: translatedHtml });
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    const orig = btnCopy.textContent;
    btnCopy.textContent = "Copied!";
    setTimeout(() => { btnCopy.textContent = orig; }, 1500);
  });

  // ── Translate ───────────────────────────────────────────────────────────────
  btnTranslate.addEventListener("click", translate);

  async function translate() {
    const html = editor.getValue().trim();
    if (!html) {
      showError(
        "Empty Input", "Nothing to translate",
        "The input panel is empty. Paste your HTML/CSS code before translating.",
        ["Paste your HTML or CSS code into the left panel.",
         "Use the Format button to clean up messy code first."]
      );
      return;
    }

    setLoading(true);
    errorPanel.classList.remove("visible");
    codeView.style.display = "";

    try {
      const res  = await fetch("/translate", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ html, source_lang: srcSel.value, target_lang: tgtSel.value }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        const msg = data.error || `Server returned HTTP ${res.status}`;
        showError("Translation Failed", categorizeStatus(res.status), msg, fixSuggestions(msg, res.status));
        return;
      }

      translatedHtml = data.translated_html;
      outputPre.textContent = translatedHtml;
      outputCount.textContent = translatedHtml.length.toLocaleString() + " chars";
      codeView.style.display = "";
      errorPanel.classList.remove("visible");
      if (outputViewMode === "preview") previewFrame.srcdoc = translatedHtml;

    } catch (err) {
      showError("Network Error", "Connection problem", err.message, [
        "Make sure the server is running and reachable.",
        "Check your internet connection.",
        "Reload the page and try again.",
      ]);
    } finally {
      setLoading(false);
    }
  }

  function categorizeStatus(status) {
    if (status === 429) return "Rate limit reached";
    if (status === 401 || status === 403) return "Authentication error";
    if (status === 413) return "Input too large";
    if (status >= 500) return "Server-side error";
    if (status >= 400) return "Request error";
    return "Could not process the code";
  }

  function fixSuggestions(msg, status) {
    const tips = [];
    const low  = (msg || "").toLowerCase();
    if (status === 429) tips.push("Wait a few seconds — you've hit the API rate limit.");
    if (status === 401 || status === 403) tips.push("The API key may be missing or invalid. Check the server configuration.");
    if (status === 413 || low.includes("too large") || low.includes("token")) {
      tips.push("The code is too large. Split it into smaller sections and translate each one.");
      tips.push("Remove HTML comments or whitespace to reduce size.");
    }
    if (status >= 500) tips.push("This is a server-side error. Wait a moment and try again.");
    if (low.includes("timeout")) tips.push("The request timed out. Try with a smaller snippet.");
    if (!tips.length) {
      tips.push("Verify the HTML is well-formed: no unclosed tags, balanced quotes.");
      tips.push("Click Format to clean up code structure before translating.");
      tips.push("Try with a minimal test snippet to narrow down the issue.");
    }
    return tips;
  }

  function showError(titleText, subtitleText, msg, fixes) {
    translatedHtml = "";
    outputCount.textContent    = "0 chars";
    codeView.style.display     = "none";
    previewFrame.style.display = "none";
    outputViewMode = "code";
    btnCode.classList.add("active");
    btnPreview.classList.remove("active");

    errorTitle.textContent    = titleText;
    errorSubtitle.textContent = subtitleText;
    errorMsgBox.textContent   = msg;

    errorFixes.innerHTML = (fixes && fixes.length)
      ? `<div class="fix-heading">How to fix it</div>` +
        fixes.map(f => `<div class="fix-item"><span class="fix-arrow">→</span><span>${escHtml(f)}</span></div>`).join("")
      : "";

    errorPanel.classList.add("visible");
  }

  function setLoading(on) {
    btnTranslate.disabled = on;
    spinner.parentElement.classList.toggle("loading", on);
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
</script>

</body>
</html>
